<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="script.js">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <nav class="sidebar">
            <div class="nav-logo">
                <i class="bi bi-file-earmark-music-fill"></i>
            </div>

            <div class="nav-library">
                <i class="bi bi-book-half"></i>
                <p>Sua Biblioteca</p>

            </div>
            <div class="nav-playlist" <h5>Crie sua primeira playlist</h5>
                <p>É fácil, vamos te ajudar</p>
                <button>Criar playlist</button>
            </div>

            <div class="nav-podcast">
                <h5>Que tal seguir um PodCast?</h5>
                <p>Avisaremos a você sobre nossos episódios</p>
                <button>Explore Podcast</button>
            </div>

            <div class="nav-footer">
                <a href="#">Legal</a>
                <a href="#">Centro de Privacidade</a>
                <a href="#">Politica de Privacidade</a>
                <a href="#">Cookies</a>
                <a href="#">Sobre Anúncios</a>
                <a href="#">Acessibilidade</a>

            </div>

            <button class="nav-lang-button">
                <i class="bi bi-globe"></i>
                Português Brasileiro
            </button>

        </nav>

        <main>
            <header class="search-bar">
                <i class="bi bi-search"></i>
                <input placeholder="O que você quer ouvir?">
            </header>

            <section class="content">
                <h2>Artistas Populares</h2>
                <div class="artists-grid">

                </div>

                <h2>Álbuns Populares</h2>
                <div class="albums-grid">

                </div>
            </section>

        </main>
    </div>



</body>
<script src="./script.js"></script>

</html>
